name: Brand intent search

# Every 3 hours. GitHub drops some scheduled runs, so there are two cron times per 3-hour slot;
# the second one is skipped when the first already ran (a successful run in the last 90 minutes).

on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "47 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print results, don't write to the sheet"
        type: boolean
        default: false

concurrency:
  group: brand-intent
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # to see when the last run finished

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Skip if the previous slot's run already happened
        id: gate
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow brand-intent.yml --status success --limit 1 \
                 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 5400 ]; then
            echo "last successful run at $last; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.skip != 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: ${{ steps.gate.outputs.skip != 'true' }}

      - name: Find brands, agencies and creators
        if: ${{ steps.gate.outputs.skip != 'true' }}
        run: python -m brand_intent.run ${{ inputs.dry_run && '--dry-run' || '' }}
